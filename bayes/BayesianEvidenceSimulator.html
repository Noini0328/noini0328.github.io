<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ベイズ証拠シミュレーター</title><style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#18232d;--muted:#687783;--a:#2f6f62;--b:#d98b43;--line:#dce4e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Yu Gothic",sans-serif}header{background:linear-gradient(135deg,#183b42,#2f6f62);color:#fff;padding:24px 5vw}header h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}header p{margin:0;opacity:.85}main{max-width:1400px;margin:auto;padding:18px 4vw 40px}.result{position:sticky;top:0;z-index:5;background:#fffffff5;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 10px 30px #14283218}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.label{color:var(--muted);font-size:14px}.value{font-size:clamp(32px,6vw,60px);font-weight:800;color:var(--a);line-height:1}.bump{animation:bump .45s}@keyframes bump{50%{transform:scale(1.08)}}.bar,.mini{height:16px;background:#e8eef0;border-radius:99px;overflow:hidden;margin:14px 0}.fill,.mini span{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a));transition:width .8s}.timeline{display:flex;gap:8px;overflow:auto}.step{min-width:125px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fafcfc}.step.active{border-color:var(--a);box-shadow:0 0 0 2px #2f6f621f}.step .name{font-weight:bold;font-size:13px}.step .v{font-size:19px;font-weight:bold;color:var(--a);margin-top:4px}.grid{display:grid;grid-template-columns:300px 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 6px 20px #1428320f}.card h2{margin:0 0 14px}label{display:block;font-weight:bold;margin:12px 0 6px}input{width:100%;padding:10px;border:1px solid #cbd6da;border-radius:9px;font-size:15px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer;background:var(--a);color:#fff;margin:6px 4px 0 0}button:hover{filter:brightness(1.08)}button.secondary{background:#e9eff0;color:var(--ink)}button.danger{background:#b95b52}.evidence{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fcfdfd;animation:appear .35s}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.head{display:flex;justify-content:space-between;align-items:center}.title{font-weight:800;color:var(--a)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formula{background:#f7faf9;border-left:5px solid var(--a);padding:14px;line-height:1.8;overflow:auto}.history{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.history:last-child{border:0}.hname{font-weight:bold}.hv{text-align:right;font-weight:bold;color:var(--a)}.note{color:var(--muted);font-size:13px;line-height:1.6}@media(max-width:850px){.grid{grid-template-columns:1fr}.history{grid-template-columns:1fr 1fr}.history .mini{grid-column:1/-1}}@media(max-width:560px){main{padding:12px}.two{grid-template-columns:1fr}}
</style></head><body>
<header><h1>ベイズ証拠シミュレーター</h1><p>証拠を一つずつ追加すると、犯人である確率がどのように更新されるかを確認します。<br>ベイズ定理を〇察官視点で見てみるとどうなるかという思考実験です。本データについて作成者は何の責任も負いません。</p></header>
<main><section class="result"><div class="top"><div><div class="label">現在の犯人である確率</div><div id="final" class="value">0%</div></div><div id="current" class="label">事前確率</div></div><div class="bar"><div id="bar" class="fill" style="width:0"></div></div><div id="timeline" class="timeline"></div></section>
<div class="grid"><aside><section class="card"><h2>捜査対象者</h2><label>対象人数</label><input id="pop" type="number" min="2" value="1000000"><p class="note">対象者の中で、最初に「真犯人は1人」と仮定します。</p><button class="secondary" onclick="resetAll()">リセット</button></section></aside>
<section><section class="card"><h2>証拠の設定</h2><div id="list"></div><button onclick="addEvidence()">＋ 次の証拠を追加</button><button class="secondary" onclick="calc()">再計算</button><p class="note">犯人なら一致する確率と、無実でも一致する確率を入力します。</p></section>
<section class="card"><h2>更新の履歴</h2><div id="history"></div></section>
<section class="card"><h2>現在の計算式</h2><div id="formula" class="formula">証拠を追加すると計算式が表示されます。</div></section></section></div></main>
<script>
const list=document.getElementById("list"),pop=document.getElementById("pop");let count=0;
function addEvidence(name="証拠"){if(count>=5)return;count++;let n=count,d=document.createElement("div");d.className="evidence";d.innerHTML='<div class="head"><div class="title">証拠 '+n+'</div><button class="danger" onclick="removeEvidence(this)">削除</button></div><label>証拠の名称</label><input class="name" value="'+name+n+'"><div class="two"><div><label>犯人なら一致する確率 (%)</label><input class="sens" type="number" min="0" max="100" step="0.0001" value="'+(n==1?100:95)+'"></div><div><label>無実でも一致する確率 (%)</label><input class="fp" type="number" min="0" max="100" step="0.0001" value="'+(n==1?0.0001:5)+'"></div></div>';list.appendChild(d);d.querySelectorAll("input").forEach(x=>x.oninput=calc);calc()}
function removeEvidence(b){b.closest(".evidence").remove();[...list.children].forEach((x,i)=>x.querySelector(".title").textContent="証拠 "+(i+1));calc()}
function fmt(v){if(v===0)return"0%";if(v<.0001)return v.toExponential(4)+"%";if(v<1)return v.toFixed(4)+"%";if(v<10)return v.toFixed(3)+"%";return v.toFixed(2)+"%"}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function calc(){let prior=1/(+pop.value||1e6),steps=[["事前確率",prior]],f="";[...list.children].forEach((d,i)=>{let name=d.querySelector(".name").value||"証拠"+(i+1),s=+d.querySelector(".sens").value/100,fp=+d.querySelector(".fp").value/100,num=s*prior,den=num+fp*(1-prior),post=den?num/den:0;f+='<b>'+(i+1)+'. '+esc(name)+'</b><br>P(犯人｜証拠) = ('+s+' × '+prior.toPrecision(8)+') / [('+s+' × '+prior.toPrecision(8)+') + ('+fp+' × '+(1-prior).toPrecision(8)+')] = <b>'+fmt(post*100)+'</b><hr>';prior=post;steps.push([name,prior])});let final=prior*100,el=document.getElementById("final");el.textContent=fmt(final);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");document.getElementById("bar").style.width=Math.min(100,final)+"%";document.getElementById("current").textContent=steps.at(-1)[0];document.getElementById("timeline").innerHTML=steps.map((s,i)=>'<div class="step '+(i==steps.length-1?"active":"")+'"><div class="name">'+esc(s[0])+'</div><div class="v">'+fmt(s[1]*100)+'</div></div>').join("");document.getElementById("history").innerHTML=steps.map(s=>'<div class="history"><div class="hname">'+esc(s[0])+'</div><div class="mini"><span style="width:'+Math.min(100,s[1]*100)+'%"></span></div><div class="hv">'+fmt(s[1]*100)+'</div></div>').join("");document.getElementById("formula").innerHTML=f||"証拠を追加すると計算式が表示されます。"}
function resetAll(){list.innerHTML="";count=0;addEvidence("DNA")}
pop.oninput=calc;addEvidence("DNA");
</script></body></html>
