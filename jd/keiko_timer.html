<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>稽古タイマー</title>
<style>
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --text:#111827; --sub:#6B7280; --line:#E5E7EB;
  --blue:#2563EB; --blue-bg:#DBEAFE; --orange:#D97706; --orange-bg:#FEF3C7;
  --red:#DC2626; --track:#E5E7EB; --sheet:#FFFFFF; --overlay:rgba(17,24,39,.45);
  --chip:#E5E7EB; --sel:#EEF2F7; --toast:#111827;
}
[data-theme="dark"]{
  --bg:#0F1115; --card:#1B1E25; --text:#F3F4F6; --sub:#9CA3AF; --line:#2A2E37;
  --blue:#4F8EF7; --blue-bg:#1E2F52; --orange:#F5A524; --orange-bg:#3A2D12;
  --red:#EF5350; --track:#2A2E37; --sheet:#1B1E25; --overlay:rgba(0,0,0,.6);
  --chip:#2A2E37; --sel:#2A2E37; --toast:#2A2E37;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Segoe UI',sans-serif;
  user-select:none;-webkit-user-select:none;transition:background .2s,color .2s}
button{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* Header */
#header{position:sticky;top:0;z-index:50;background:var(--bg);display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:14px 16px 10px}
.title-block h1{font-size:20px;font-weight:800;white-space:nowrap}
.title-block p{font-size:10px;color:var(--sub);letter-spacing:2px;margin-top:1px}
#tab-bar{display:flex;background:var(--chip);border-radius:10px;padding:3px;flex-shrink:0}
.tab-btn{border:none;background:transparent;color:var(--sub);font-size:13px;font-weight:600;
  padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab-btn.active{background:var(--card);color:var(--blue)}

#content{flex:1;display:flex;flex-direction:column}
.theme-btn{border:none;background:var(--chip);color:var(--text);font-size:13px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;white-space:nowrap}
.screen{padding:8px 16px 16px;display:none;flex-direction:column;overflow:hidden}

/* Rows (tap to edit) */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;border:none;background:var(--card);
  border-radius:14px;padding:18px 16px;cursor:pointer;text-align:left;color:var(--text);min-height:72px}
.row:active{background:var(--sel)}
.row-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ico-rounds{background:var(--blue-bg)} .ico-keiko{background:var(--blue-bg)} .ico-interval{background:var(--orange-bg)}
.row-label{flex:1;font-size:14px;font-weight:600;color:var(--sub)}
.row-val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.row-chev{color:var(--sub);font-size:20px;font-weight:300}

/* Big buttons */
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;
  border-radius:14px;height:76px;font-size:22px;font-weight:800;color:#fff;cursor:pointer}
.big-btn:active{opacity:.85;transform:scale(.99)}
.btn-start{background:var(--blue);margin-top:16px;height:88px;font-size:26px}
.btn-blue{background:var(--blue)} .btn-red{background:var(--red)} .btn-orange{background:var(--orange)}

/* Running */
.round-info{text-align:center;margin:6px 0 10px}
.round-ratio{color:var(--sub);font-size:14px;font-weight:600;min-height:18px}
.round-main{font-size:34px;font-weight:800;margin-top:2px}
.ring-wrap{position:relative;width:220px;height:220px;margin:0 auto 12px}
#progress-canvas{position:absolute;inset:0}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time-display{font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:2px}
.time-label{font-size:12px;color:var(--sub);margin-top:2px;letter-spacing:2px}
.phase-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.badge{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700}
.badge-keiko{background:var(--blue-bg);color:var(--blue)}
.badge-interval{background:var(--orange-bg);color:var(--orange)}
.chip{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;background:var(--chip);color:var(--sub)}
.chip b{color:var(--text)}
.controls{display:flex;gap:10px}
.controls .big-btn{height:72px;font-size:18px;flex:1}

/* Modal (bottom sheet) */
.modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal.open{display:flex}
.sheet{width:100%;max-width:480px;background:var(--sheet);border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-title{font-size:16px;font-weight:800;text-align:center;margin-bottom:14px}
.sheet-done{margin-top:16px;height:60px;font-size:18px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:transparent;color:var(--sub);font-size:15px;font-weight:700;padding:14px 8px;border-radius:9px;cursor:pointer}
.seg button.active{background:var(--card);color:var(--orange)}
.drum-row{display:flex;justify-content:center;align-items:flex-start;gap:10px}
.picker-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.picker-col label{font-size:12px;color:var(--sub);font-weight:600}
.drum-wrap{position:relative;border-radius:12px;background:var(--bg);overflow:hidden}
.drum-wrap::before,.drum-wrap::after{content:'';position:absolute;left:0;right:0;height:44px;z-index:2;pointer-events:none}
.drum-wrap::before{top:0;background:linear-gradient(var(--bg) 15%,transparent)}
.drum-wrap::after{bottom:0;background:linear-gradient(transparent,var(--bg) 85%)}
.drum-sel{position:absolute;left:6px;right:6px;top:50%;height:48px;transform:translateY(-50%);background:var(--sel);border-radius:10px;z-index:1;pointer-events:none}
.drum{position:relative;z-index:0;height:144px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.drum::-webkit-scrollbar{display:none}
.drum-item{height:48px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:28px;font-weight:700;color:var(--sub);opacity:.45;font-variant-numeric:tabular-nums}
.drum-item.center{color:var(--text);opacity:1}
.colon{font-size:30px;font-weight:800;color:var(--sub);padding-top:42px}

/* Settings */
.sec-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:1px;margin:18px 4px 8px}
.theme-opts{display:flex;gap:10px}
.theme-opt{flex:1;height:64px;border:2px solid transparent;background:var(--card);color:var(--sub);border-radius:14px;
  font-size:15px;font-weight:700;cursor:pointer}
.theme-opt.active{border-color:var(--blue);color:var(--blue)}

#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-6px);background:var(--toast);color:#fff;
  padding:12px 22px;border-radius:10px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;white-space:nowrap;z-index:300}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="title-block"><h1>稽古タイマー</h1><p>KEIKO TIMER</p></div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">ダークモード</button>
  </div>

  <div id="content">
    <!-- IDLE -->
    <div class="screen" id="screen-idle">
      <div class="rows" id="rows-idle"></div>
      <button class="big-btn btn-start" onclick="startTimer()">▶ スタート</button>
    </div>

    <!-- RUNNING -->
    <div class="screen" id="screen-running">
      <div class="round-info">
        <div class="round-ratio" id="round-ratio"></div>
        <div class="round-main" id="round-main">1 本目</div>
      </div>
      <div class="ring-wrap">
        <canvas id="progress-canvas" width="440" height="440" style="width:220px;height:220px"></canvas>
        <div class="ring-inner">
          <div class="time-display" id="time-display">03:00</div>
          <div class="time-label" id="time-label">残り時間</div>
        </div>
      </div>
      <div class="phase-row">
        <div class="badge badge-keiko" id="phase-badge">稽古中</div>
        <div class="chip" id="interval-chip">インターバル <b id="chip-val">手動</b></div>
      </div>
      <div class="controls">
        <button class="big-btn btn-blue" id="btn-pause" onclick="togglePause()"><span id="pause-icon">⏸</span><span id="pause-label">一時停止</span></button>
        <button class="big-btn btn-red" onclick="stopTimer()">⏹ 停止</button>
      </div>
    </div>

  </div>
</div>

<!-- Edit sheet -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-title" id="sheet-title"></div>
    <div id="sheet-body"></div>
    <button class="big-btn btn-blue sheet-done" onclick="closeModal()">完了</button>
  </div>
</div>
<div id="toast"></div>

<script>
// ===== STATE =====
let repeatCount=null, keikoMin=2, keikoSec=0, intervalMin=0, intervalSec=20;
let manualInterval=false, theme='light';
let timerState='idle', currentRound=1, phase='keiko', remainingSec=0, ticker=null, currentTab='timer';

// ===== AUDIO =====
let actx=null;
function getACtx(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function schedTone(freq,start,dur,vol=1.0){
  try{
    const a=getACtx(), o=a.createOscillator(), o2=a.createOscillator(), g=a.createGain(), t=a.currentTime+start;
    o.type='square'; o2.type='sine'; o.frequency.value=freq; o2.frequency.value=freq*1.5;
    o.connect(g); o2.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(vol,t); g.gain.setValueAtTime(vol,t+dur-0.03); g.gain.linearRampToValueAtTime(0,t+dur);
    o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur);
  }catch(e){}
}
function beepKeikoStart(){schedTone(880,0,1.5);}
function beepPips(){for(let s=0;s<3;s++)for(let i=0;i<4;i++)schedTone(880,s*0.7+i*0.1,0.08);}
const beepIntervalStart=beepPips, beepFinish=beepPips;

// ===== UTIL =====
function fmt2(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  clearTimeout(toastTimer); t.classList.remove('show');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}));
}
function setTheme(t){
  theme=t; document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme-btn').textContent=t==='light'?'ダークモード':'ライトモード';
  if(isRunning()) updateRunUI();
}
function toggleTheme(){setTheme(theme==='light'?'dark':'light');}
function isRunning(){return timerState==='running'||timerState==='paused'||timerState==='waiting';}

// ===== ROWS =====
const ROW_DEFS=[
  {key:'rounds',  ico:'🔁', cls:'ico-rounds',  label:'本数'},
  {key:'keiko',   ico:'🥋', cls:'ico-keiko',   label:'稽古時間'},
  {key:'interval',ico:'💤', cls:'ico-interval',label:'インターバル'}
];
function buildRows(id){
  document.getElementById(id).innerHTML=ROW_DEFS.map(r=>
    `<button class="row" onclick="openModal('${r.key}')">
       <span class="row-label">${r.label}</span>
       <span class="row-val" data-val="${r.key}"></span>
       <span class="row-chev">›</span>
     </button>`).join('');
}
function intervalText(){return manualInterval?'なし（手動）':fmt2(intervalMin*60+intervalSec);}
function refreshRows(){
  const v={rounds:repeatCount===null?'∞ 無限':repeatCount+' 本', keiko:fmt2(keikoMin*60+keikoSec), interval:intervalText()};
  document.querySelectorAll('[data-val]').forEach(el=>el.textContent=v[el.dataset.val]);
  const cv=document.getElementById('chip-val'); if(cv) cv.textContent=intervalText();
}

// ===== TABS =====
function refreshView(){
  const run=isRunning();
  document.getElementById('screen-idle').style.display=run?'none':'flex';
  document.getElementById('screen-running').style.display=run?'flex':'none';
  refreshRows();
}

// ===== MODAL =====
let pendingInit=[];
function makeDrum(items,index,onChange,labelText,width){
  const col=document.createElement('div'); col.className='picker-col';
  if(labelText){const l=document.createElement('label'); l.textContent=labelText; col.appendChild(l);}
  const wrap=document.createElement('div'); wrap.className='drum-wrap'; wrap.style.width=width+'px';
  const sel=document.createElement('div'); sel.className='drum-sel';
  const drum=document.createElement('div'); drum.className='drum';
  const pad=()=>{const p=document.createElement('div'); p.style.height='48px'; return p;};
  drum.appendChild(pad());
  items.forEach((t,i)=>{const d=document.createElement('div'); d.className='drum-item'+(i===index?' center':''); d.textContent=t; drum.appendChild(d);});
  drum.appendChild(pad());
  wrap.appendChild(sel); wrap.appendChild(drum); col.appendChild(wrap);
  pendingInit.push(()=>{drum.scrollTop=index*48;});
  let tm=null;
  drum.addEventListener('scroll',()=>{
    clearTimeout(tm);
    tm=setTimeout(()=>{
      const v=Math.max(0,Math.min(items.length-1,Math.round(drum.scrollTop/48)));
      drum.querySelectorAll('.drum-item').forEach((el,i)=>el.classList.toggle('center',i===v));
      onChange(v);
    },100);
  });
  return col;
}
const nums=n=>Array.from({length:n},(_,i)=>String(i).padStart(2,'0'));
function timeDrums(min,sec,onChange){
  let m=min,s=sec;
  const row=document.createElement('div'); row.className='drum-row';
  const colon=document.createElement('div'); colon.className='colon'; colon.textContent=':';
  row.appendChild(makeDrum(nums(60),m,v=>{m=v;onChange(m,s);},'分',110));
  row.appendChild(colon);
  row.appendChild(makeDrum(nums(60),s,v=>{s=v;onChange(m,s);},'秒',110));
  return row;
}
function openModal(kind){
  const body=document.getElementById('sheet-body'); body.innerHTML=''; pendingInit=[];
  const title=document.getElementById('sheet-title');
  if(kind==='rounds'){
    title.textContent='本数';
    const items=['∞ 無限',...Array.from({length:100},(_,i)=>(i+1)+' 本')];
    const row=document.createElement('div'); row.className='drum-row';
    row.appendChild(makeDrum(items,repeatCount===null?0:repeatCount,v=>{repeatCount=v===0?null:v;refreshRows();},'',200));
    body.appendChild(row);
  } else if(kind==='keiko'){
    title.textContent='稽古時間';
    body.appendChild(timeDrums(keikoMin,keikoSec,(m,s)=>{keikoMin=m;keikoSec=s;refreshRows();}));
  } else {
    title.textContent='インターバル';
    const seg=document.createElement('div'); seg.className='seg';
    seg.innerHTML='<button id="seg-manual">なし（手動）</button><button id="seg-time">時間を指定</button>';
    body.appendChild(seg);
    const holder=document.createElement('div'); body.appendChild(holder);
    const draw=()=>{
      seg.querySelector('#seg-manual').classList.toggle('active',manualInterval);
      seg.querySelector('#seg-time').classList.toggle('active',!manualInterval);
      holder.innerHTML=''; pendingInit=[];
      if(manualInterval){
        const n=document.createElement('div'); n.style.cssText='text-align:center;color:var(--sub);font-size:14px;font-weight:600;line-height:1.7;padding:48px 0';
        n.innerHTML='稽古が終わったら待機し、<br>画面をタップすると次の稽古が始まります';
        holder.appendChild(n);
      } else {
        holder.appendChild(timeDrums(intervalMin,intervalSec,(m,s)=>{intervalMin=m;intervalSec=s;refreshRows();}));
        requestAnimationFrame(()=>pendingInit.forEach(f=>f()));
      }
      refreshRows();
    };
    seg.querySelector('#seg-manual').onclick=()=>{manualInterval=true;draw();};
    seg.querySelector('#seg-time').onclick=()=>{manualInterval=false;draw();};
    draw();
  }
  document.getElementById('modal').classList.add('open');
  requestAnimationFrame(()=>pendingInit.forEach(f=>f()));
}
function closeModal(){document.getElementById('modal').classList.remove('open'); refreshRows();}

// ===== TIMER CORE =====
function startTimer(){
  getACtx();
  currentRound=1; phase='keiko'; remainingSec=keikoMin*60+keikoSec; timerState='running';
  beepKeikoStart(); showToast('1 本目　開始！');
  refreshView(); startTick(); updateRunUI();
}
function togglePause(){
  if(timerState==='waiting'){manualNext();return;}
  if(timerState==='running'){timerState='paused'; clearInterval(ticker); ticker=null;}
  else if(timerState==='paused'){timerState='running'; startTick();}
  updateRunUI();
}
function stopTimer(){clearInterval(ticker); ticker=null; timerState='idle'; refreshView();}
function startTick(){clearInterval(ticker); ticker=setInterval(tick,1000);}
function tick(){if(remainingSec>0){remainingSec--; updateRunUI();} else onPhaseComplete();}
function onPhaseComplete(){
  if(phase==='keiko'){
    if(manualInterval){
      clearInterval(ticker); ticker=null; timerState='waiting';
      beepIntervalStart(); showToast('インターバル（タップで次へ）'); updateRunUI();
    } else {
      const s=intervalMin*60+intervalSec;
      if(s>0){phase='interval'; remainingSec=s; beepIntervalStart(); showToast('インターバル'); updateRunUI();}
      else nextRound();
    }
  } else nextRound();
}
function manualNext(){if(timerState==='waiting') nextRound();}
function nextRound(){
  const next=currentRound+1;
  if(repeatCount!==null&&next>repeatCount){
    clearInterval(ticker); ticker=null; timerState='finished';
    beepFinish(); showToast('終了！お疲れ様でした');
    setTimeout(()=>{timerState='idle'; refreshView();},2000);
  } else {
    currentRound=next; phase='keiko'; remainingSec=keikoMin*60+keikoSec; timerState='running';
    startTick(); beepKeikoStart(); showToast(currentRound+' 本目　開始！'); updateRunUI();
  }
}

// ===== RUNNING UI =====
function updateRunUI(){
  const waiting=timerState==='waiting', isKeiko=phase==='keiko';
  document.getElementById('time-display').textContent=waiting?'--:--':fmt2(remainingSec);
  document.getElementById('time-label').textContent=waiting?'タップで次へ':'残り時間';
  document.getElementById('round-main').textContent=currentRound+' 本目';
  document.getElementById('round-ratio').textContent=repeatCount===null?'∞':currentRound+' / '+repeatCount;
  const b=document.getElementById('phase-badge');
  if(waiting){b.className='badge badge-interval'; b.textContent='インターバル（待機中）';}
  else if(isKeiko){b.className='badge badge-keiko'; b.textContent='稽古中';}
  else {b.className='badge badge-interval'; b.textContent='インターバル';}
  document.getElementById('interval-chip').style.display=(isKeiko||waiting)&&!waiting?'':'none';
  const pb=document.getElementById('btn-pause');
  if(waiting){pb.className='big-btn btn-orange'; document.getElementById('pause-icon').textContent='▶'; document.getElementById('pause-label').textContent='次の稽古を開始';}
  else {
    pb.className='big-btn btn-blue';
    document.getElementById('pause-icon').textContent=timerState==='paused'?'▶':'⏸';
    document.getElementById('pause-label').textContent=timerState==='paused'?'再開':'一時停止';
  }
  const total=isKeiko?keikoMin*60+keikoSec:intervalMin*60+intervalSec;
  drawRing(waiting?0:(total>0?remainingSec/total:0),isKeiko,waiting);
}
function drawRing(prog,isKeiko,waiting){
  const c=document.getElementById('progress-canvas'), ctx=c.getContext('2d'), cs=getComputedStyle(document.documentElement);
  const cx=220,cy=220,r=192;
  ctx.clearRect(0,0,440,440);
  ctx.lineWidth=22; ctx.lineCap='butt';
  ctx.strokeStyle=waiting?cs.getPropertyValue('--orange').trim():cs.getPropertyValue('--track').trim();
  if(waiting) ctx.globalAlpha=.35;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
  if(!waiting&&prog>0){
    ctx.strokeStyle=isKeiko?(prog>0.2?cs.getPropertyValue('--blue').trim():cs.getPropertyValue('--red').trim()):cs.getPropertyValue('--orange').trim();
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*prog); ctx.stroke();
  }
}
// 待機中にリングをタップでも次へ
document.querySelector('.ring-wrap').addEventListener('click',manualNext);

// iOS バウンス防止（ドラム内のスクロールだけ許可）
document.addEventListener('touchmove',e=>{ if(!e.target.closest('.drum')) e.preventDefault(); },{passive:false});

// ===== INIT =====
buildRows('rows-idle'); refreshView();
</script>
</body>
</html>
