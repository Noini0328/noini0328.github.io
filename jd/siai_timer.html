<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>柔道審判タイマー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --aka:#c0202e;--aka-bg:#fff0f0;--aka-dim:rgba(192,32,46,.12);--aka-txt:#8b0000;
  --shiro:#555;--shiro-bg:#f8f8ff;--shiro-dim:rgba(100,100,130,.1);--shiro-txt:#333;
  --gold:#c8a000;--green:#2e7d32;--orange:#c62828;--blue:#1565c0;
  --surf:#e8eaf6;--deep:#f0f2f8;--border:rgba(0,0,0,.12);
  --txt:#1a1a2e;--txt2:rgba(20,20,50,.6);--card-bg:rgba(255,255,255,.85);
  --hdr-bg:#3949ab;--hdr-txt:#fff;
  --foot-bg:#3949ab;--foot-txt:#fff;
  --shadow:0 2px 8px rgba(0,0,0,.12);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --aka:#e53935;--aka-bg:#1e080a;--aka-dim:rgba(229,57,53,.15);--aka-txt:#ff8a80;
  --shiro:#ccc;--shiro-bg:#0a0a18;--shiro-dim:rgba(200,200,200,.1);--shiro-txt:#ddd;
  --gold:#ffd700;--green:#4caf50;--orange:#ff5722;--blue:#42a5f5;
  --surf:#16213e;--deep:#0d0d1a;--border:rgba(255,255,255,.12);
  --txt:#f0f0ff;--txt2:rgba(220,220,255,.55);--card-bg:rgba(255,255,255,.05);
  --hdr-bg:#0f1a3d;--hdr-txt:#e8eaf6;
  --foot-bg:#0f1a3d;--foot-txt:#e8eaf6;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
html,body{height:100%;overflow:hidden}
body{background:var(--deep);color:var(--txt);
  font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif;
  display:flex;flex-direction:column;
  padding-top:var(--st);padding-bottom:var(--sb);
  user-select:none;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s;}

/* ── ヘッダー ── */
#hdr{background:var(--hdr-bg);display:flex;align-items:center;gap:8px;
  padding:8px 12px;flex-shrink:0;box-shadow:var(--shadow);}
#settings-btn{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.35);
  border-radius:9px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;
  gap:6px;color:var(--hdr-txt);font-size:15px;font-weight:700;}
#settings-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.hbadge{padding:5px 12px;border-radius:7px;font-size:14px;font-weight:800;
  letter-spacing:.6px;border:2px solid;white-space:nowrap;}
#status-badge{color:var(--hdr-txt);border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.15)}
#hdr-r{margin-left:auto;display:flex;align-items:center;}
#result-badge{padding:6px 14px;border-radius:10px;font-size:16px;font-weight:900;
  border:2.5px solid;white-space:nowrap;text-align:center;min-width:90px;}

/* ── 大タイマー ── */
#timer-row{background:var(--hdr-bg);display:flex;align-items:center;justify-content:center;
  padding:6px 0 10px;flex-shrink:0;}
#timer{font-size:clamp(48px,12vw,88px);font-weight:900;letter-spacing:4px;
  font-variant-numeric:tabular-nums;color:var(--hdr-txt);
  padding:0 16px;border-radius:10px;line-height:1.15;transition:color .3s;}
#timer.low{color:#ffcdd2;animation:pulse .7s ease-in-out infinite alternate;}
@keyframes pulse{from{opacity:1}to{opacity:.55}}

/* ── メイン ── */
#main{flex:1;display:flex;flex-direction:row;overflow:hidden;min-height:0;position:relative;}
.panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0;}
.panel.aka{background:var(--aka-bg)}.panel.shiro{background:var(--shiro-bg)}
.divider{width:2px;background:var(--border);flex-shrink:0}
.phdr{padding:6px 4px;text-align:center;font-size:clamp(16px,3vw,24px);font-weight:900;
  letter-spacing:7px;flex-shrink:0;}
.aka .phdr{background:var(--aka-dim);color:var(--aka)}
.shiro .phdr{background:var(--shiro-dim);color:var(--shiro)}

/* スコアエリア */
.scores{flex:1;display:flex;flex-direction:column;padding:3px 4px 2px;gap:3px;
  overflow:hidden;min-height:0;}
/* 2カラムペア（一本+技あり、有効+指導） */
.score-pair{display:flex;gap:3px;flex:1;min-height:0;}
/* 抑え込み：1カラム高（flex:1と同じ） */
.osae-wrap{flex:1;min-height:0;}

/* ── スコアカード ── */
.scard{flex:1;position:relative;border-radius:10px;border:2px solid;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;min-height:0;transition:filter .12s,box-shadow .12s;
  background:var(--card-bg);box-shadow:var(--shadow);}
.scard:active{filter:brightness(.88);box-shadow:none;}
.scard.disabled{opacity:.35;cursor:default;pointer-events:none}
/* 統一ラベルサイズ変数 */
:root{--lbl:clamp(13px,2.5vw,20px);}
.sc-label{font-size:var(--lbl);font-weight:800;color:var(--txt2);
  letter-spacing:.3px;line-height:1;}
.sc-val{font-size:clamp(36px,8.5vw,70px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;}
.sc-badge{font-size:clamp(7px,1.2vw,11px);font-weight:700;line-height:1.1;}
.inv-btn{position:absolute;bottom:2px;right:3px;font-size:clamp(8px,1.1vw,11px);
  font-weight:700;padding:2px 5px;border-radius:4px;border:1.5px solid;
  cursor:pointer;line-height:1;z-index:2;background:rgba(0,0,0,.06);}
[data-theme="dark"] .inv-btn{background:rgba(0,0,0,.3);color:rgba(255,255,255,.5);
  border-color:rgba(255,255,255,.25);}
[data-theme="light"] .inv-btn{color:rgba(0,0,0,.45);border-color:rgba(0,0,0,.22);}
.inv-btn:active{filter:brightness(.85)}
.inv-btn.disabled{opacity:.2;pointer-events:none}

/* ── 抑え込みカード：縦レイアウト（ラベル上・ボタン下横並び） ── */
.osae-card{height:100%;border-radius:10px;border:2px solid var(--border);
  display:flex;flex-direction:column;align-items:stretch;
  padding:5px 5px 5px;gap:5px;overflow:hidden;background:var(--card-bg);
  box-shadow:var(--shadow);position:relative;}
.osae-card.active{background:#e8f5e9;border-color:#2e7d32;border-width:2.5px;}
[data-theme="dark"] .osae-card.active{background:rgba(10,50,10,.85);border-color:#4caf50;}
/* ラベル行（上段） */
.osae-info{display:flex;flex-direction:row;align-items:center;justify-content:center;
  gap:8px;flex-shrink:0;}
.otitle{font-size:var(--lbl);font-weight:800;color:var(--txt2);white-space:nowrap;}
.othresh{font-size:clamp(9px,1.4vw,12px);color:var(--txt2);opacity:.7;white-space:nowrap;}
/* ボタン行（下段・横並び） */
.osae-btn-row{display:flex;flex-direction:row;gap:5px;flex:1;min-height:0;}
/* 抑え込みボタン：縦に伸びる大型 */
.osae-abtn{flex:1;border-radius:9px;border:2.5px solid;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;background:rgba(255,255,255,.04);transition:filter .12s;
  -webkit-tap-highlight-color:transparent;min-width:0;}
.osae-abtn:active{filter:brightness(.85)}
.osae-abtn:disabled{opacity:.25;cursor:default;pointer-events:none}
.osae-abtn svg{width:clamp(22px,4.5vw,38px);height:clamp(22px,4.5vw,38px);
  stroke:currentColor;fill:none;stroke-width:2.2;}
.osae-abtn span{font-size:var(--lbl);font-weight:800;line-height:1;}
/* 縦進捗バー（ボタン行の右端に細く） */
.osae-prog-v{width:6px;flex-shrink:0;background:rgba(0,0,0,.08);border-radius:3px;
  position:relative;overflow:hidden;align-self:stretch;}
[data-theme="dark"] .osae-prog-v{background:rgba(255,255,255,.1);}
.osae-prog-fill{position:absolute;bottom:0;left:0;right:0;border-radius:3px;
  transition:height .95s linear;}
.osae-prog-mark{position:absolute;left:-2px;right:-2px;height:3px;
  background:var(--gold);border-radius:2px;}
/* ポップアップ：スコアエリア中央に重ねる */
.osae-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.78);color:#fff;border-radius:16px;
  padding:10px 22px;text-align:center;pointer-events:none;z-index:50;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  backdrop-filter:blur(6px);box-shadow:0 4px 24px rgba(0,0,0,.4);}
.osae-popup-num{font-size:clamp(42px,10vw,80px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;}
.osae-popup-lbl{font-size:clamp(12px,2vw,18px);font-weight:700;opacity:.85;}
.osae-popup-state{font-size:clamp(11px,1.8vw,16px);font-weight:700;margin-top:2px;}

/* ── フッター ── */
#footer{background:var(--foot-bg);flex-shrink:0;
  display:flex;flex-direction:row;align-items:stretch;
  gap:6px;padding:8px 10px;box-shadow:0 -2px 8px rgba(0,0,0,.15);
  min-height:84px;}
#btn-main{flex:2;border-radius:14px;border:3px solid;cursor:pointer;
  font-size:clamp(20px,4.5vw,30px);font-weight:900;letter-spacing:1px;
  background:rgba(255,255,255,.12);transition:filter .12s;
  color:var(--foot-txt);-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;}
#btn-main:active{filter:brightness(1.3)}
#btn-main:disabled{opacity:.35;cursor:default;pointer-events:none}
.foot-btn{flex:1;border-radius:11px;border:2px solid;cursor:pointer;
  font-size:clamp(14px,2.8vw,20px);font-weight:800;
  background:rgba(255,255,255,.1);color:var(--foot-txt);
  display:flex;align-items:center;justify-content:center;
  transition:filter .12s;-webkit-tap-highlight-color:transparent;}
.foot-btn:active{filter:brightness(1.25)}
.foot-btn:disabled{opacity:.3;cursor:default;pointer-events:none}

/* ── モーダル ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:12px;}
.modal-ov.hidden{display:none}
.modal{background:var(--surf);border-radius:16px;border:1px solid var(--border);
  padding:20px;width:100%;max-width:420px;max-height:90dvh;overflow-y:auto;
  color:var(--txt);box-shadow:0 8px 32px rgba(0,0,0,.3);}
.modal h2{font-size:17px;font-weight:700;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.mact button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;
  font-size:14px;font-weight:700;}
.btn-cancel{background:rgba(128,128,128,.2);color:var(--txt)}
.btn-ok{color:#fff}
/* 設定 */
.ss{background:rgba(255,255,255,.5);border-radius:10px;border:1px solid var(--border);
  margin-bottom:12px;overflow:hidden;}
[data-theme="dark"] .ss{background:rgba(255,255,255,.06);}
.ss-title{color:#3949ab;font-size:12px;font-weight:700;letter-spacing:1px;padding:8px 14px 4px;}
[data-theme="dark"] .ss-title{color:var(--gold);}
.srow{display:flex;align-items:center;padding:7px 14px;}
.srow label{flex:1;color:var(--txt);font-size:13px;}
.vctrl{display:flex;align-items:center;gap:4px;}
.vdisp{width:68px;text-align:center;color:var(--txt);font-size:14px;font-weight:700;}
.circ{width:32px;height:32px;border-radius:50%;border:2px solid #3949ab;
  color:#3949ab;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:transparent;font-size:18px;font-weight:700;line-height:1;}
[data-theme="dark"] .circ{border-color:var(--gold);color:var(--gold);}
.circ:disabled{opacity:.3;cursor:default;}
.sdiv{height:1px;background:var(--border);margin:0 14px;}
.swrow{display:flex;align-items:center;padding:9px 14px;}
.swrow label{flex:1;color:var(--txt);font-size:13px;}
.sw{width:44px;height:25px;border-radius:13px;border:none;cursor:pointer;
  position:relative;transition:background .2s;flex-shrink:0;}
.sw::after{content:'';position:absolute;top:4px;width:17px;height:17px;
  border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.sw.off{background:rgba(0,0,0,.2)}.sw.off::after{left:3px}
.sw.on{background:#3949ab}.sw.on::after{left:23px}
[data-theme="dark"] .sw.on{background:var(--gold)}
.prev-box{background:rgba(57,73,171,.08);border-radius:10px;
  border:1px solid rgba(57,73,171,.25);padding:12px;margin-bottom:4px;}
[data-theme="dark"] .prev-box{background:rgba(255,215,0,.07);border-color:rgba(255,215,0,.25);}
.prev-box .pt{color:#3949ab;font-size:12px;font-weight:700;margin-bottom:6px;}
[data-theme="dark"] .prev-box .pt{color:var(--gold);}
.pr{display:flex;gap:4px;font-size:12px;margin-bottom:2px;}
.pr .pl{color:var(--txt2)}.pr .pv{color:var(--txt);font-weight:700;}
</style>
</head>
<body>

<!-- ヘッダー -->
<div id="hdr">
  <button id="settings-btn" onclick="openSettings()">
    <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    設定
  </button>
  <span class="hbadge" id="status-badge">待機中</span>
  <div id="hdr-r"><div id="result-badge">－</div></div>
</div>

<!-- 大タイマー -->
<div id="timer-row"><div id="timer">02:00</div></div>

<!-- メイン：白(左) | 赤(右) -->
<div id="main">
  <div class="panel shiro" id="panel-shiro">
    <div class="phdr">白</div>
    <div class="scores" id="scores-shiro"></div>
  </div>
  <div class="divider"></div>
  <div class="panel aka" id="panel-aka">
    <div class="phdr">赤</div>
    <div class="scores" id="scores-aka"></div>
  </div>
</div>
<!-- 抑え込み中ポップアップ（スコアエリア中央・全パネル横断） -->
<div id="osae-global-popup" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  pointer-events:none;z-index:40;display:flex;align-items:center;justify-content:center;">
  <div id="osae-popup-inner" style="background:rgba(0,0,0,.78);color:#fff;border-radius:18px;
    padding:12px 28px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    backdrop-filter:blur(6px);box-shadow:0 4px 24px rgba(0,0,0,.4);">
    <div id="opp-num" style="font-size:clamp(50px,12vw,90px);font-weight:900;line-height:1;
      font-variant-numeric:tabular-nums;"></div>
    <div id="opp-lbl" style="font-size:clamp(13px,2.2vw,20px);font-weight:700;opacity:.85;">秒</div>
    <div id="opp-state" style="font-size:clamp(12px,2vw,18px);font-weight:800;margin-top:2px;"></div>
  </div>
</div>

<!-- フッター -->
<div id="footer">
  <button class="foot-btn" id="btn-invalid" onclick="handleInvalid()"
    style="border-color:rgba(255,255,255,.4)" disabled>✕ 無効</button>
  <button id="btn-main" onclick="handleMainBtn()">▶ 開始</button>
  <button class="foot-btn" onclick="confirmReset()"
    style="border-color:rgba(255,255,255,.4)">↺ リセット</button>
</div>

<!-- リセット確認 -->
<div class="modal-ov hidden" id="reset-modal">
  <div class="modal">
    <h2>⚠️ リセット確認</h2>
    <p style="font-size:14px;line-height:1.7;color:var(--txt2)">
      試合データをすべてリセットしますか？<br>この操作は取り消せません。</p>
    <div class="mact">
      <button class="btn-cancel" onclick="closeModal('reset-modal')">キャンセル</button>
      <button class="btn-ok" style="background:#c62828" onclick="doReset()">リセット</button>
    </div>
  </div>
</div>

<!-- 無効確認 -->
<div class="modal-ov hidden" id="invalid-modal">
  <div class="modal">
    <h2>✕ 無効（取り消し）</h2>
    <div id="inv-preview" style="background:rgba(0,0,0,.06);border-radius:8px;
      padding:10px;font-size:13px;line-height:1.9;color:var(--txt);min-height:36px;"></div>
    <div class="mact">
      <button class="btn-cancel" onclick="closeModal('invalid-modal')">キャンセル</button>
      <button class="btn-ok" style="background:#c62828" onclick="doInvalid()">無効にする</button>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="modal-ov hidden" id="settings-modal">
  <div class="modal">
    <h2>⚙️ 設定</h2>
    <!-- テーマ切替 -->
    <div class="ss">
      <div class="ss-title">🎨 表示テーマ</div>
      <div class="swrow">
        <label>ダークモード</label>
        <button class="sw off" id="sw-dark" onclick="toggleDark()"></button>
      </div>
    </div>
    <div class="ss">
      <div class="ss-title">⏱️ 試合時間</div>
      <div class="srow">
        <label>試合時間</label>
        <div class="vctrl">
          <button class="circ" onclick="adjS('matchDur',-30)">－</button>
          <div class="vdisp" id="disp-matchDur">2分</div>
          <button class="circ" onclick="adjS('matchDur',30)">＋</button>
        </div>
      </div>
    </div>
    <div class="ss">
      <div class="ss-title">🔒 抑え込み</div>
      <div class="srow">
        <label>技あり（秒）</label>
        <div class="vctrl">
          <button class="circ" onclick="adjS('osaeWazaari',-1)">－</button>
          <div class="vdisp" id="disp-osaeWazaari">10秒</div>
          <button class="circ" onclick="adjS('osaeWazaari',1)">＋</button>
        </div>
      </div>
      <div class="sdiv"></div>
      <div class="srow">
        <label>一本（秒）</label>
        <div class="vctrl">
          <button class="circ" onclick="adjS('osaeMax',-1)">－</button>
          <div class="vdisp" id="disp-osaeMax">20秒</div>
          <button class="circ" onclick="adjS('osaeMax',1)">＋</button>
        </div>
      </div>
    </div>
    <div class="ss">
      <div class="ss-title">🟡 指導</div>
      <div class="swrow">
        <label>指導による勝敗判定</label>
        <button class="sw on" id="sw-shido" onclick="toggleShido()"></button>
      </div>
      <div class="sdiv"></div>
      <div class="srow" id="shido-count-row">
        <label>何回で負け</label>
        <div class="vctrl">
          <button class="circ" onclick="adjS('shidoLim',-1)">－</button>
          <div class="vdisp" id="disp-shidoLim">3回</div>
          <button class="circ" onclick="adjS('shidoLim',1)">＋</button>
        </div>
      </div>
    </div>
    <div class="prev-box">
      <div class="pt">📋 設定プレビュー</div>
      <div class="pr"><span class="pl">試合時間：</span><span class="pv" id="prev-matchDur"></span></div>
      <div class="pr"><span class="pl">技あり：</span><span class="pv" id="prev-osaeWazaari"></span></div>
      <div class="pr"><span class="pl">一本：</span><span class="pv" id="prev-osaeMax"></span></div>
      <div class="pr"><span class="pl">指導判定：</span><span class="pv" id="prev-shido"></span></div>
    </div>
    <div class="mact">
      <button class="btn-cancel" onclick="closeModal('settings-modal')">キャンセル</button>
      <button class="btn-ok" style="background:#3949ab;color:#fff" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ══ 状態 ═════════════════════════════════════════
const S={
  cfg:{matchDur:120,osaeWazaari:10,osaeMax:20,shidoEnabled:true,shidoLim:3,dark:false},
  aka:  {ippon:0,wazaari:0,yuko:0,shido:0,osaeSecs:0},
  shiro:{ippon:0,wazaari:0,yuko:0,shido:0,osaeSecs:0},
  status:'idle',remaining:120,
  osaeSide:null,osaeOn:false,
  history:[],pending:null,
};
let mTmr=null,oTmr=null;
const MXH=20;

// ── スナップショット ──────────────────────────────
function snap(){
  return{aka:{...S.aka},shiro:{...S.shiro},
    status:S.status,remaining:S.remaining,
    osaeSide:S.osaeSide,osaeOn:S.osaeOn};
}
function pushH(){S.history.push(snap());if(S.history.length>MXH)S.history.shift();}

// ── 勝敗 ─────────────────────────────────────────
function getResult(){
  const a=S.aka,w=S.shiro,c=S.cfg;
  if(a.ippon>=1&&w.ippon<1)return'aka';if(w.ippon>=1&&a.ippon<1)return'shiro';
  if(a.wazaari>=2&&w.wazaari<2)return'aka';if(w.wazaari>=2&&a.wazaari<2)return'shiro';
  if(c.shidoEnabled){
    if(a.shido>=c.shidoLim&&w.shido<c.shidoLim)return'shiro';
    if(w.shido>=c.shidoLim&&a.shido<c.shidoLim)return'aka';
  }
  if(a.wazaari>w.wazaari)return'aka';if(w.wazaari>a.wazaari)return'shiro';
  if(a.yuko>w.yuko)return'aka';if(w.yuko>a.yuko)return'shiro';
  return'draw';
}
function decided(){
  const a=S.aka,w=S.shiro,c=S.cfg;
  if(a.ippon>=1||w.ippon>=1)return true;
  if(a.wazaari>=2||w.wazaari>=2)return true;
  if(c.shidoEnabled&&(a.shido>=c.shidoLim||w.shido>=c.shidoLim))return true;
  return false;
}

// ── タイマー ─────────────────────────────────────
function startMTmr(){
  clearInterval(mTmr);
  mTmr=setInterval(()=>{
    if(S.remaining>0){S.remaining--;render();if(decided())finish(false);}
    else finish(true);
  },1000);
}
function startMatch(){
  if(S.status==='finished')return;
  if(S.status==='idle'){S.remaining=S.cfg.matchDur;beepStart();}
  S.status='running';startMTmr();render();
}
function pauseMatch(){
  clearInterval(mTmr);
  if(S.osaeOn){clearInterval(oTmr);S.osaeOn=false;}
  S.status='paused';render();
}
function finish(timeUp){
  clearInterval(mTmr);clearInterval(oTmr);
  S.osaeOn=false;S.osaeSide=null;
  S.status='finished';
  beepEnd();
  render();
}
function handleMainBtn(){
  if(S.status==='idle'||S.status==='paused')startMatch();
  else if(S.status==='running')pauseMatch();
}

// ── スコア操作 ────────────────────────────────────
function addScore(side,field){
  pushH();
  const p=S[side],c=S.cfg;
  if(field==='ippon')   p.ippon  =Math.min(1,p.ippon+1);
  if(field==='wazaari') p.wazaari=Math.min(2,p.wazaari+1);
  if(field==='yuko')    p.yuko++;
  if(field==='shido')   p.shido  =Math.min(c.shidoLim,p.shido+1);
  if(decided()&&S.status==='running')finish(false);
  render();
}
function subScore(side,field,e){
  e&&e.stopPropagation();
  pushH();
  const p=S[side];
  if(field==='ippon')   p.ippon  =Math.max(0,p.ippon-1);
  if(field==='wazaari') p.wazaari=Math.max(0,p.wazaari-1);
  if(field==='yuko')    p.yuko   =Math.max(0,p.yuko-1);
  if(field==='shido')   p.shido  =Math.max(0,p.shido-1);
  render();
}

// ── 無効（アンドゥ）──────────────────────────────
function handleInvalid(){
  if(!S.history.length){alert('戻せる操作がありません');return;}
  S.pending=S.history[S.history.length-1];
  const prev=S.pending;
  const lines=[];
  let ipponChanged=false;
  for(const side of['aka','shiro']){
    const lbl=side==='aka'?'赤':'白';
    const cur=S[side],pre=prev[side];
    if(cur.ippon!==pre.ippon){lines.push(`${lbl} 一本: ${cur.ippon}→${pre.ippon}`);ipponChanged=true;}
    if(cur.wazaari!==pre.wazaari)lines.push(`${lbl} 技あり: ${cur.wazaari}→${pre.wazaari}`);
    if(cur.yuko!==pre.yuko)    lines.push(`${lbl} 有効: ${cur.yuko}→${pre.yuko}`);
    if(cur.shido!==pre.shido)  lines.push(`${lbl} 指導: ${cur.shido}→${pre.shido}`);
    if(cur.osaeSecs!==pre.osaeSecs)lines.push(`${lbl} 抑え込み: ${cur.osaeSecs}秒→${pre.osaeSecs}秒`);
  }
  if(ipponChanged){
    lines.push(`⏱ 時間も戻します: ${fmtT(S.remaining)}→${fmtT(prev.remaining)}`);
  } else {
    lines.push(`⏱ 時間はそのまま継続（現在: ${fmtT(S.remaining)}）`);
  }
  document.getElementById('inv-preview').innerHTML=lines.map(l=>`・${l}`).join('<br>');
  document.getElementById('invalid-modal').classList.remove('hidden');
}
function doInvalid(){
  if(!S.pending)return;
  const prev=S.history.pop();
  let ipponChanged=false;
  for(const side of['aka','shiro'])
    if(S[side].ippon!==prev[side].ippon)ipponChanged=true;
  S.aka={...prev.aka};S.shiro={...prev.shiro};
  S.osaeSide=prev.osaeSide;
  if(ipponChanged){
    clearInterval(mTmr);clearInterval(oTmr);
    S.remaining=prev.remaining;
    const st=prev.status==='finished'?'running':prev.status;
    S.status=st;
    if(st==='running')startMTmr();
    if(prev.osaeOn&&prev.osaeSide){S.osaeOn=true;startOTmr(prev.osaeSide);}
    else S.osaeOn=false;
  } else {
    S.osaeOn=prev.osaeOn;
  }
  S.pending=null;
  closeModal('invalid-modal');render();
}

// ── リセット ──────────────────────────────────────
function confirmReset(){document.getElementById('reset-modal').classList.remove('hidden');}
function doReset(){
  clearInterval(mTmr);clearInterval(oTmr);
  S.aka={ippon:0,wazaari:0,yuko:0,shido:0,osaeSecs:0};
  S.shiro={ippon:0,wazaari:0,yuko:0,shido:0,osaeSecs:0};
  S.status='idle';S.remaining=S.cfg.matchDur;
  S.osaeSide=null;S.osaeOn=false;S.history=[];
  closeModal('reset-modal');render();
}

// ── 抑え込み ──────────────────────────────────────
function startOTmr(side){
  clearInterval(oTmr);
  oTmr=setInterval(()=>{
    const p=S[side];p.osaeSecs++;
    const c=S.cfg;
    if(p.osaeSecs===c.osaeWazaari&&p.wazaari<2){pushH();p.wazaari=Math.min(2,p.wazaari+1);}
    render();
    if(p.osaeSecs>=c.osaeMax){
      clearInterval(oTmr);S.osaeOn=false;S.osaeSide=null;
      pushH();S[side].ippon=Math.min(1,S[side].ippon+1);
      finish(false);return;
    }
    if(decided()&&S.status==='running')finish(false);
  },1000);
}
function osaeStart(side){
  if(S.osaeOn&&S.osaeSide===side){clearInterval(oTmr);S.osaeOn=false;render();return;}
  if(S.osaeSide&&S.osaeSide!==side)S[S.osaeSide].osaeSecs=0;
  S.osaeSide=side;S.osaeOn=true;
  if(S.status!=='running')startMatch();
  startOTmr(side);render();
}
function osaeRelease(side){
  pushH();clearInterval(oTmr);
  S.osaeSide=null;S.osaeOn=false;S[side].osaeSecs=0;render();
}

// ── 音 ───────────────────────────────────────────
let _ac;
function gAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function _beep(f,d,t,v=1){
  const ac=gAC(),g=ac.createGain(),o=ac.createOscillator();
  g.gain.setValueAtTime(v,t);
  g.gain.setValueAtTime(v,t+d-0.05);  // 最後まで音量を保持
  g.gain.exponentialRampToValueAtTime(0.001,t+d+0.02);
  o.type='square';o.frequency.setValueAtTime(f,t);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.05);
}
// 開始音：880Hz 2.5秒、同じ高さのまま伸ばす
function beepStart(){
  const ac=gAC();if(ac.state==='suspended')ac.resume();
  _beep(880,2.5,ac.currentTime,1);
}
// 終了・一本音：880Hz 0.1秒×4連打→0.3秒休み を3セット
function beepEnd(){
  const ac=gAC();if(ac.state==='suspended')ac.resume();
  const t0=ac.currentTime;
  for(let s=0;s<3;s++){const b=t0+s*0.7;for(let i=0;i<4;i++)_beep(880,0.09,b+i*0.1,1);}
}

// ── テーマ ────────────────────────────────────────
let tmpDark=false;
function toggleDark(){
  tmpDark=!tmpDark;
  document.getElementById('sw-dark').className='sw '+(tmpDark?'on':'off');
}
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
}

// ── 設定 ─────────────────────────────────────────
let tmp={};
function openSettings(){
  tmp={...S.cfg};tmpDark=S.cfg.dark;
  document.getElementById('sw-dark').className='sw '+(tmpDark?'on':'off');
  updUI();document.getElementById('settings-modal').classList.remove('hidden');
}
function adjS(k,d){
  if(k==='matchDur')    tmp.matchDur   =Math.max(60,Math.min(600,tmp.matchDur+d));
  if(k==='osaeWazaari') tmp.osaeWazaari=Math.max(1,Math.min(59,tmp.osaeWazaari+d));
  if(k==='osaeMax')     tmp.osaeMax    =Math.max(5,Math.min(60,tmp.osaeMax+d));
  if(k==='shidoLim')    tmp.shidoLim   =Math.max(1,Math.min(5,tmp.shidoLim+d));
  updUI();
}
function toggleShido(){tmp.shidoEnabled=!tmp.shidoEnabled;updUI();}
function updUI(){
  const t=tmp,m=t.matchDur;
  const ms=m%60===0?`${m/60}分`:`${Math.floor(m/60)}分${m%60}秒`;
  document.getElementById('disp-matchDur').textContent=ms;
  document.getElementById('disp-osaeWazaari').textContent=t.osaeWazaari+'秒';
  document.getElementById('disp-osaeMax').textContent=t.osaeMax+'秒';
  document.getElementById('disp-shidoLim').textContent=t.shidoLim+'回';
  document.getElementById('sw-shido').className='sw '+(t.shidoEnabled?'on':'off');
  document.getElementById('shido-count-row').style.display=t.shidoEnabled?'':'none';
  document.getElementById('prev-matchDur').textContent=ms;
  document.getElementById('prev-osaeWazaari').textContent=t.osaeWazaari+'秒';
  document.getElementById('prev-osaeMax').textContent=t.osaeMax+'秒';
  document.getElementById('prev-shido').textContent=t.shidoEnabled?`${t.shidoLim}回で負け`:'無効';
}
function saveSettings(){
  tmp.dark=tmpDark;
  S.cfg={...tmp};
  if(S.status==='idle')S.remaining=S.cfg.matchDur;
  applyTheme(S.cfg.dark);
  closeModal('settings-modal');render();
}
function closeModal(id){document.getElementById(id).classList.add('hidden');}

// ── 描画 ─────────────────────────────────────────
function fmtT(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

function render(){renderHdr();renderPanel('shiro');renderPanel('aka');renderFooter();renderOsaePopup();}

function renderOsaePopup(){
  const pop=document.getElementById('osae-global-popup');
  if(!S.osaeSide||!S.osaeOn){pop.style.display='none';return;}
  const p=S[S.osaeSide];
  const c=S.cfg;
  const secs=p.osaeSecs;
  const barC=secs<c.osaeWazaari?'#4caf50':secs<c.osaeMax?'#f9a825':'#c62828';
  const stateStr=secs<c.osaeWazaari?'計測中':secs<c.osaeMax?'技あり付与済':'一本!';
  document.getElementById('opp-num').textContent=secs;
  document.getElementById('opp-num').style.color=barC;
  document.getElementById('opp-lbl').style.color=barC;
  document.getElementById('opp-state').textContent=stateStr;
  document.getElementById('opp-state').style.color=barC;
  pop.style.display='flex';
}

function renderHdr(){
  const el=document.getElementById('timer');
  const low=S.remaining<=30&&S.status==='running';
  el.textContent=fmtT(S.remaining);el.className=low?'low':'';
  const sb=document.getElementById('status-badge');
  const sm={
    idle:    ['待機中', '#546e7a', '#fff'],
    running: ['試合中', '#2e7d32', '#fff'],
    paused:  ['停止中', '#f57f17', '#fff'],
    finished:['終　了', '#c62828', '#fff'],
  };
  const[st,sbg,sfg]=sm[S.status];
  sb.textContent=st;
  sb.style.color=sfg;
  sb.style.borderColor=sbg;
  sb.style.background=sbg;
  const rb=document.getElementById('result-badge');
  const r=getResult();
  // 勝敗バッジ：完全塗りつぶしで見やすく
  const rm={
    aka:  ['🔴 赤 勝ち', '#c62828', '#fff'],
    shiro:['⚪ 白 勝ち', '#455a64', '#fff'],
    draw: ['引き分け',   '#e65100', '#fff'],
  };
  if(rm[r]){
    const[t,bg,fg]=rm[r];
    rb.textContent=t;
    rb.style.color=fg;
    rb.style.borderColor=bg;
    rb.style.background=bg;
    rb.style.fontWeight='900';
  } else {
    rb.textContent='勝敗判定中';
    rb.style.color='rgba(255,255,255,.55)';
    rb.style.borderColor='rgba(255,255,255,.25)';
    rb.style.background='rgba(255,255,255,.1)';
    rb.style.fontWeight='700';
  }
}

function renderPanel(side){
  const isAka=side==='aka';
  // ライトモード用の色（赤側は赤、白側はネイビー）
  const isDark=S.cfg.dark;
  const bc=isAka?'#c0202e':'#3949ab';
  const bcD=isAka?'#e53935':'#cccccc';
  const baseColor=isDark?bcD:bc;
  const p=S[side],c=S.cfg,cont=document.getElementById('scores-'+side);

  const defs=[
    {key:'ippon',  label:'一本',
     color:p.ippon>=1?'#bf360c':baseColor,
     bg:p.ippon>=1?(isDark?'rgba(255,107,53,.13)':'rgba(191,54,12,.08)'):'',
     val:p.ippon,  badge:p.ippon>=1?'上限':null, badgeC:'#bf360c', addOk:p.ippon<1},
    {key:'wazaari',label:'技有',
     color:p.wazaari>=2?'#1565c0':baseColor,
     bg:p.wazaari>=2?(isDark?'rgba(33,150,243,.13)':'rgba(21,101,192,.08)'):'',
     val:p.wazaari,badge:p.wazaari>=2?'一本相当':'/2',
     badgeC:p.wazaari>=2?'#1565c0':'rgba(0,0,0,.35)', addOk:p.wazaari<2},
    {key:'yuko',   label:'有効',
     color:baseColor,bg:'',val:p.yuko,badge:null,addOk:true},
    {key:'shido',  label:'指導',
     color:'#c8a000',
     bg:p.shido>=c.shidoLim?(isDark?'rgba(255,215,0,.1)':'rgba(200,160,0,.08)'):'',
     val:p.shido,badge:p.shido>=c.shidoLim?'負け':`/${c.shidoLim}`,
     badgeC:p.shido>=c.shidoLim?'#c62828':'rgba(0,0,0,.35)',addOk:p.shido<c.shidoLim},
  ];

  function card(r){
    const col=r.color;
    const bgExtra=r.bg?`background:${r.bg};`:'';
    const invOk=r.val>0;
    return`<div class="scard${r.addOk?'':' disabled'}"
      style="border-color:${col}60;${bgExtra}"
      onclick="addScore('${side}','${r.key}')">
      <div class="sc-label">${r.label}</div>
      <div class="sc-val" style="color:${col}">${r.val}</div>
      ${r.badge?`<div class="sc-badge" style="color:${r.badgeC}">${r.badge}</div>`:''}
      <button class="inv-btn${invOk?'':' disabled'}"
        onclick="subScore('${side}','${r.key}',event)" ${invOk?'':'disabled'}>無効</button>
    </div>`;
  }

  // 抑え込み
  const myOsae=S.osaeSide===side;
  const osaeOn=myOsae&&S.osaeOn;
  const secs=p.osaeSecs,wSecs=c.osaeWazaari,maxSecs=c.osaeMax;
  const prog=maxSecs>0?Math.min(1,secs/maxSecs):0;
  const wProg=maxSecs>0?Math.min(1,wSecs/maxSecs):0;
  const barC=secs<wSecs?'#2e7d32':secs<maxSecs?'#f9a825':'#c62828';
  const secsC=myOsae?barC:(isDark?'rgba(255,255,255,.28)':'rgba(0,0,0,.28)');
  const stateStr=!myOsae?'':secs<wSecs?'計測中':secs<maxSecs?'技あり付与済':'一本!';
  const canStart=(!S.osaeOn||(S.osaeOn&&myOsae))&&
    (S.status==='running'||S.status==='paused'||S.status==='idle');
  const sBtnC=osaeOn?'#f9a825':'#2e7d32';
  const sIcon=osaeOn
    ?`<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
    :`<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;

  // 進捗バー縦：高さをprogで
  const fillH=(prog*100).toFixed(1);
  const markBot=Math.max(0,Math.min(100,(wProg*100))).toFixed(1);

  const osaeHTML=`<div class="osae-card${myOsae?' active':''}">
    <div class="osae-info">
      <span class="otitle">抑込</span>
      <span class="othresh">技${wSecs}秒/一本${maxSecs}秒</span>
    </div>
    <div class="osae-btn-row">
      <button class="osae-abtn"
        style="border-color:${canStart?sBtnC:'rgba(128,128,128,.3)'};color:${canStart?sBtnC:(isDark?'rgba(255,255,255,.25)':'rgba(0,0,0,.25)')}"
        onclick="osaeStart('${side}')" ${canStart?'':'disabled'}>
        ${sIcon}<span>${osaeOn?'一時停止':'開始'}</span>
      </button>
      <button class="osae-abtn"
        style="border-color:${myOsae?'#c62828':'rgba(128,128,128,.3)'};color:${myOsae?'#c62828':(isDark?'rgba(255,255,255,.25)':'rgba(0,0,0,.25)')}"
        onclick="osaeRelease('${side}')" ${myOsae?'':'disabled'}>
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="11" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>解けた</span>
      </button>
      <div class="osae-prog-v">
        <div class="osae-prog-fill" style="height:${fillH}%;background:${barC}"></div>
        <div class="osae-prog-mark" style="bottom:${markBot}%"></div>
      </div>
    </div>
  </div>`;

  cont.innerHTML=`
    <div class="score-pair">${card(defs[0])}${card(defs[1])}</div>
    <div class="score-pair">${card(defs[2])}${card(defs[3])}</div>
    <div class="osae-wrap">${osaeHTML}</div>`;
}

function renderFooter(){
  const bm=document.getElementById('btn-main');
  const bi=document.getElementById('btn-invalid');
  bi.disabled=!S.history.length;
  const cfg={
    idle:    ['▶ 開始',false,'rgba(255,255,255,.9)'],
    running: ['⏸ 一時停止',false,'#fff176'],
    paused:  ['▶ 再開',false,'rgba(255,255,255,.9)'],
    finished:['終　了',true,'rgba(255,255,255,.35)'],
  }[S.status];
  bm.textContent=cfg[0];bm.disabled=cfg[1];
  bm.style.borderColor=cfg[2];bm.style.color=cfg[2];
}

// ── 初期化 ────────────────────────────────────────
render();
window.addEventListener('resize',render);
</script>
